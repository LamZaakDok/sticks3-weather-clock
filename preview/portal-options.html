<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配网界面 · 两种方案</title>
<style>
  body{margin:0;background:#3a3f46;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
       padding:26px;display:flex;gap:26px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .phone{width:360px;background:#000;border-radius:26px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .scr{border-radius:20px;overflow:hidden;min-height:720px}
  .cap{color:#c9ced6;font-size:13px;text-align:center;margin-top:10px;letter-spacing:.04em}
  .lock{vertical-align:-1px}

  /* ============ 方案 A · 浅色极简 ============ */
  .va{background:#f6f7f9;color:#0f172a;padding:26px 18px 30px;min-height:720px}
  .va *{box-sizing:border-box}
  .va .brand{font-size:11px;letter-spacing:.16em;color:#98a2b3;font-weight:600}
  .va h1{font-size:22px;font-weight:650;margin:8px 0 4px;letter-spacing:-.01em}
  .va .sub{font-size:13px;color:#667085;margin-bottom:18px}
  .va .sec{font-size:11px;letter-spacing:.1em;color:#98a2b3;font-weight:600;margin:18px 0 8px}
  .va .card{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:14px}
  .va label{display:block;font-size:12.5px;color:#475467;margin:12px 0 6px;font-weight:500}
  .va label:first-child{margin-top:0}
  .va input,.va select{width:100%;padding:11px 12px;border:1px solid #d9dee5;border-radius:10px;
       background:#fff;font-size:15px;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
  .va input:focus,.va select:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.10)}
  .va .row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #eef1f5}
  .va .row:last-child{border-bottom:none}
  .va .row .l{font-size:14px;color:#1d2939}
  .va .bars{display:flex;gap:2px;align-items:flex-end}
  .va .bars i{width:3px;background:#cfd4dc;border-radius:1px;display:block}
  .va .bars i.on{background:#0f766e}
  .va .b1{height:5px}.va .b2{height:8px}.va .b3{height:11px}.va .b4{height:14px}
  .va .btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:10px;background:#0f766e;
       color:#fff;font-size:15px;font-weight:600;letter-spacing:.01em}
  .va .foot{font-size:11.5px;color:#98a2b3;text-align:center;margin-top:14px}
  .va .lang{float:right;font-size:12px;color:#98a2b3}
  .va .lang b{color:#0f766e}
  .va .seg{display:flex;border:1px solid #d9dee5;border-radius:10px;overflow:hidden}
  .va .seg span{flex:1;text-align:center;padding:9px 0;font-size:13.5px;color:#475467;background:#fff}
  .va .seg span.on{background:#0f766e;color:#fff;font-weight:600}
  .va .hint{font-size:11.5px;color:#98a2b3;margin-top:6px}

  /* ============ 方案 B · 深色精致 ============ */
  .vb{background:#0e1114;color:#e6eaf0;padding:26px 18px 30px;min-height:720px}
  .vb *{box-sizing:border-box}
  .vb .brand{font-size:11px;letter-spacing:.16em;color:#5b6472;font-weight:600}
  .vb h1{font-size:22px;font-weight:650;margin:8px 0 4px;letter-spacing:-.01em}
  .vb .sub{font-size:13px;color:#7b8592;margin-bottom:18px}
  .vb .sec{font-size:11px;letter-spacing:.1em;color:#5b6472;font-weight:600;margin:18px 0 8px}
  .vb .card{background:#15191e;border:1px solid #232a31;border-radius:14px;padding:14px}
  .vb label{display:block;font-size:12.5px;color:#98a2ad;margin:12px 0 6px;font-weight:500}
  .vb label:first-child{margin-top:0}
  .vb input,.vb select{width:100%;padding:11px 12px;border:1px solid #2a323a;border-radius:10px;
       background:#0f1316;font-size:15px;color:#e6eaf0;outline:none;transition:.15s}
  .vb input:focus,.vb select:focus{border-color:#c9962b;box-shadow:0 0 0 3px rgba(201,150,43,.14)}
  .vb .row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #1b2127}
  .vb .row:last-child{border-bottom:none}
  .vb .row .l{font-size:14px;color:#cdd5df}
  .vb .bars{display:flex;gap:2px;align-items:flex-end}
  .vb .bars i{width:3px;background:#333b44;border-radius:1px;display:block}
  .vb .bars i.on{background:#c9962b}
  .vb .b1{height:5px}.vb .b2{height:8px}.vb .b3{height:11px}.vb .b4{height:14px}
  .vb .btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:10px;background:#c9962b;
       color:#1a1305;font-size:15px;font-weight:700;letter-spacing:.01em}
  .vb .foot{font-size:11.5px;color:#5b6472;text-align:center;margin-top:14px}
  .vb .lang{float:right;font-size:12px;color:#5b6472}
  .vb .lang b{color:#c9962b}
  .vb .seg{display:flex;border:1px solid #2a323a;border-radius:10px;overflow:hidden}
  .vb .seg span{flex:1;text-align:center;padding:9px 0;font-size:13.5px;color:#98a2ad;background:#0f1316}
  .vb .seg span.on{background:#c9962b;color:#1a1305;font-weight:600}
  .vb .hint{font-size:11.5px;color:#5b6472;margin-top:6px}
</style></head>
<body>

<div>
  <div class="phone"><div class="scr va">
    <div class="brand">STICKS3 · WEATHER</div>
    <span class="lang">中文 <b>·</b> EN</span>
    <h1>设备配网</h1>
    <div class="sub">连接 WiFi 并设置城市</div>

    <div class="sec">WiFi</div>
    <div class="card">
      <label>网络名称</label>
      <input value="宿舍-WiFi">
      <label>密码</label>
      <input type="password" value="12345678">
      <label>城市</label>
      <input value="青岛">
    </div>

    <div class="sec">附近网络</div>
    <div class="card">
      <div class="row"><span class="l">宿舍-WiFi <svg class="lock" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></span>
        <span class="bars"><i class="b1 on"></i><i class="b2 on"></i><i class="b3 on"></i><i class="b4 on"></i></span></div>
      <div class="row"><span class="l">TP-LINK_5G <svg class="lock" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></span>
        <span class="bars"><i class="b1 on"></i><i class="b2 on"></i><i class="b3 on"></i><i class="b4"></i></span></div>
      <div class="row"><span class="l">M5Stack-WiFi</span>
        <span class="bars"><i class="b1 on"></i><i class="b2 on"></i><i class="b3"></i><i class="b4"></i></span></div>
    </div>

    <div class="sec">显示与数据</div>
    <div class="card">
      <label>界面语言</label>
      <div class="seg"><span class="on">简体中文</span><span>English</span></div>
      <label>天气数据源</label>
      <select><option>默认（Open-Meteo）</option><option>自定义接口</option></select>
    </div>

    <button class="btn">保存并连接</button>
    <div class="foot">StickS3 校园天气机 · v0.1.0</div>
  </div></div>
  <div class="cap">方案 A · 浅色极简</div>
</div>

<div>

        <span class="bars"><i class="b1 on"></i><i class="b2 on"></i><i class="b3 on"></i><i class="b4 on"></i></span></div>
      <div class="row"><span class="l">TP-LINK_5G <svg class="lock" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7b8592" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></span>
        <span class="bars"><i class="b1 on"></i><i class="b2 on"></i><i class="b3 on"></i><i class="b4"></i></span></div>

</div>

</body></html>
