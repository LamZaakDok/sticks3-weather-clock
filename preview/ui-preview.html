<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StickS3 天气机 · 界面预览 (135x240)</title>
<style>
  :root { --scale: 2.6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1d24; color: #cfd6e2;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font-size: 16px; font-weight: 600; color: #8ea0b8; letter-spacing: .05em; }
  .row { display: flex; gap: 26px; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cap { font-size: 12px; color: #7f8ea6; }
  .bezel {
    width: calc(135px * 2.6 + 16px); height: calc(240px * 2.6 + 16px);
    padding: 8px; border-radius: 22px; background: #0b0e14; flex: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px #2a2f3a;
  }
  /* 真实屏幕 135x240，用 transform 放大 */
  .screen {
    width: 135px; height: 240px; border-radius: 14px; overflow: hidden;
    transform: scale(var(--scale)); transform-origin: top left;
    position: relative; color: #fff;
    background: linear-gradient(160deg, #16283f 0%, #0d1a2b 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .screen .inner { position: absolute; inset: 0; display: flex; flex-direction: column; }
  /* 各页背景主题 */
  .bg-sun    { background: linear-gradient(160deg,#2a6fb0 0%,#16324f 100%); }
  .bg-partly { background: linear-gradient(160deg,#2b5f92 0%,#13273c 100%); }
  .bg-cloud  { background: linear-gradient(160deg,#33485f 0%,#141d29 100%); }
  .bg-rain   { background: linear-gradient(160deg,#274b63 0%,#0e1a26 100%); }

  .topbar { display: flex; justify-content: space-between; align-items: center;
            padding: 6px 8px 0 8px; font-size: 13px; font-weight: 600; }
  .batt { font-size: 11px; font-weight: 500; opacity: .85; }
  .subrow { padding: 1px 8px 0 8px; font-size: 9px; opacity: .7; }

  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .bigtemp { font-size: 52px; font-weight: 700; line-height: .9; letter-spacing: -2px; }
  .bigtemp .deg { font-size: 26px; vertical-align: top; font-weight: 600; }
  .desc { font-size: 14px; font-weight: 600; margin-top: 2px; }

  .stats { display: flex; justify-content: space-around; padding: 0 6px 4px 6px; }
  .stat { text-align: center; }
  .stat .k { font-size: 8px; opacity: .62; }
  .stat .v { font-size: 12px; font-weight: 600; margin-top: 1px; }

  .tagbar { display: flex; gap: 4px; padding: 5px 6px 7px 6px; }
  .tag { flex: 1; text-align: center; font-size: 9.5px; font-weight: 600;
         padding: 5px 2px; border-radius: 8px; }
  .tag.on  { background: #2f80ed; color: #fff; }
  .tag.warm{ background: rgba(255,190,90,.22); color:#ffcf7a; }
  .tag.off { background: rgba(255,255,255,.10); color:#cfd8e6; }

  .pagehead { padding: 8px 8px 2px; font-size: 12px; font-weight: 600; opacity:.9; }
  .days { flex: 1; padding: 2px 7px; display: flex; flex-direction: column; }
  .dayrow { display: flex; align-items: center; gap: 6px; padding: 4.5px 0;
            border-bottom: 1px solid rgba(255,255,255,.07); }
  .dayrow .d { width: 34px; font-size: 11px; font-weight: 600; }
  .dayrow .d small { display:block; font-size: 8px; opacity:.6; font-weight:500;}
  .dayrow .ic { width: 26px; display:flex; justify-content:center; }
  .dayrow .t { flex: 1; text-align: right; font-size: 11.5px; font-weight: 600; }
  .dayrow .t small { opacity: .55; font-weight: 500; }

  .bigcard { flex: 1; padding: 4px 6px 6px; display: flex; flex-direction: column; gap: 6px; }
  .card { background: rgba(255,255,255,.07); border-radius: 10px; padding: 7px 8px; }
  .card .ct { font-size: 9px; opacity: .65; margin-bottom: 3px; }
  .card .cv { font-size: 15px; font-weight: 700; }
  .card .cd { font-size: 9px; opacity: .8; margin-top: 3px; line-height: 1.35; }

  .indicator { display: flex; justify-content: center; gap: 5px; padding: 0 0 6px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .dot.on { background: #4ea1ff; width: 14px; border-radius: 3px; }
  .legend { font-size: 12px; color:#8ea0b8; max-width: 1100px; line-height:1.7; text-align:center;}
  .legend b{color:#cfd6e2;}
</style>
</head>
<body>
<h1>StickS3 校园天气机 · 界面预览（真实 135 × 240，放大 2.6 倍）</h1>
<div class="row">

  <!-- 页面 0：今日 -->
  <div class="wrap">
    <div class="bezel"><div class="screen bg-partly"><div class="inner" id="p0"></div></div></div>
    <div class="cap">① 今日（开机默认）</div>
  </div>

  <!-- 页面 1：未来几天 -->
  <div class="wrap">
    <div class="bezel"><div class="screen bg-cloud"><div class="inner" id="p1"></div></div></div>
    <div class="cap">② 未来几天</div>
  </div>

  <!-- 页面 2：生活提示 -->
  <div class="wrap">
    <div class="bezel"><div class="screen bg-rain"><div class="inner" id="p2"></div></div></div>
    <div class="cap">③ 穿衣 / 带伞提示</div>
  </div>

</div>

<div class="legend">
  <b>操作：</b> KEY1 单击 = 切换下一页（页数循环）&nbsp;·&nbsp; KEY2 单击 = 立即刷新天气 &nbsp;·&nbsp; KEY2 长按 3 秒 = 重新配网 &nbsp;·&nbsp; 开机自动联网、每 30 分钟自动更新一次
</div>

<script>
/* ---------- SVG 天气图标（和固件里用图元画的形状保持一致） ---------- */
function icon(type, size){
  const s = size, u = s/64;
  const stroke = '#fff';
  const sun   = `<circle cx="32" cy="32" r="13" fill="#ffd15c"/>`+
                [0,45,90,135,180,225,270,315].map(a=>{
                  const r1=18,r2=26,rad=a*Math.PI/180;
                  return `<line x1="${32+r1*Math.cos(rad)}" y1="${32+r1*Math.sin(rad)}" x2="${32+r2*Math.cos(rad)}" y2="${32+r2*Math.sin(rad)}" stroke="#ffd15c" stroke-width="4" stroke-linecap="round"/>`;
                }).join('');
  const sunsm = `<circle cx="24" cy="24" r="10" fill="#ffd15c"/>`;
  const cloud = (fill,op)=>`<g opacity="${op||1}"><circle cx="22" cy="38" r="12" fill="${fill}"/><circle cx="34" cy="32" r="15" fill="${fill}"/><circle cx="46" cy="39" r="11" fill="${fill}"/><rect x="20" y="38" width="28" height="13" rx="6.5" fill="${fill}"/></g>`;
  const drops = `<g stroke="#7fc4ff" stroke-width="3.4" stroke-linecap="round">`+
                [26,38,50].map((x,i)=>`<line x1="${x}" y1="${54+i%2*3}" x2="${x-2.5}" y2="${62+i%2*3}"/>`).join('')+`</g>`;
  const snow  = `<g stroke="#dbeeff" stroke-width="2.6" stroke-linecap="round">`+
                [26,38,50].map(x=>`<line x1="${x-3}" y1="58" x2="${x+3}" y2="58"/><line x1="${x}" y1="55" x2="${x}" y2="61"/>`).join('')+`</g>`;
  const bolt  = `<polygon points="34,50 26,62 33,62 29,72 42,57 34,57" fill="#ffd15c"/>`;
  const fog   = `<g stroke="#cfe2f5" stroke-width="3" stroke-linecap="round"><line x1="16" y1="56" x2="48" y2="56"/><line x1="20" y1="63" x2="44" y2="63"/></g>`;
  let body='';
  switch(type){
    case 'sun':      body = sun; break;
    case 'partly':   body = sunsm + cloud('#ffffff',.97); break;
    case 'cloud':    body = cloud('#ffffff',.97); break;
    case 'overcast': body = `<g opacity=".55">${cloud('#9fb2c6',1)}</g><g transform="translate(6,6)">${cloud('#e9eef5',1)}</g>`; break;
    case 'rain':     body = cloud('#e9eef5',1) + drops; break;
    case 'shower':   body = sunsm + `<g transform="translate(10,6)">${cloud('#e9eef5',1)}</g>` + `<g transform="translate(10,4)">${drops}</g>`; break;
    case 'snow':     body = cloud('#e9eef5',1) + snow; break;
    case 'thunder':  body = cloud('#c9d3df',1) + bolt; break;
    case 'fog':      body = cloud('#dbe4ee',1) + fog; break;
    default:         body = cloud('#ffffff',.97);
  }
  const h = Math.round(s * 76 / 64);
  return `<svg width="${s}" height="${h}" viewBox="0 0 64 76" style="display:block">${body}</svg>`;
}

/* ---------- 页面 0：今日 ---------- */
document.getElementById('p0').innerHTML = `
  <div class="topbar"><span>北京</span><span class="batt">82% ▮</span></div>
  <div class="subrow">10月10日 周六 · 21:03</div>
  <div class="hero">
    <div style="margin-top:-2px">${icon('partly',66)}</div>
    <div class="bigtemp">23<span class="deg">°C</span></div>
    <div class="desc">晴间多云</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">体感</div><div class="v">21°</div></div>
    <div class="stat"><div class="k">湿度</div><div class="v">45%</div></div>
    <div class="stat"><div class="k">风速</div><div class="v">3.2m/s</div></div>
  </div>
  <div class="tagbar">
    <div class="tag warm">👕 薄外套</div>
    <div class="tag off">☂ 不用带伞</div>
  </div>
  <div class="indicator"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
`;

/* ---------- 页面 1：未来几天 ---------- */
function day(name, sub, ty, ic, hi, lo){
  return `<div class="dayrow"><div class="d">${name}<small>${sub}</small></div>
    <div class="ic">${icon(ic,26)}</div>
    <div class="t">${hi}° <small>/ ${lo}°</small></div></div>`;
}
document.getElementById('p1').innerHTML = `
  <div class="pagehead">未来 5 天</div>
  <div class="days">
    ${day('今天','周六','','partly',23,15)}
    ${day('明天','周日','','rain',19,14)}
    ${day('周一','','','cloud',21,13)}
    ${day('周二','','','sun',25,16)}
    ${day('周三','','','thunder',22,15)}
    ${day('周四','','','overcast',20,14)}
  </div>
  <div class="indicator"><span class="dot"></span><span class="dot on"></span><span class="dot"></span></div>
`;

/* ---------- 页面 2：穿衣 / 带伞 ---------- */
document.getElementById('p2').innerHTML = `
  <div class="pagehead">生活提示</div>
  <div class="bigcard">
    <div class="card">
      <div class="ct">👕 穿衣建议</div>
      <div class="cv">加件薄外套</div>
      <div class="cd">白天 23°，早晚 15°，宿舍出门记得套件外套，别只穿短袖。</div>
    </div>
    <div class="card" style="background:rgba(47,128,237,.22)">
      <div class="ct">☂ 要带伞吗</div>
      <div class="cv" style="color:#ffcf7a">明天记得带伞</div>
      <div class="cd">明天降雨概率 70%，有中雨。</div>
    </div>
    <div class="card">
      <div class="ct">🌤 其他</div>
      <div class="cd">紫外线 中等 · 日落 18:12 · 空气 良</div>
    </div>
  </div>
  <div class="indicator"><span class="dot"></span><span class="dot"></span><span class="dot on"></span></div>
`;
</script>
</body>
</html>
